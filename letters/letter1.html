const salt = "BY0e5m77D8U9BTPv2JafUw==";
const iv = "vbleES4gkf6NM4kU";


function base64ToBytes(base64) {
    return Uint8Array.from(
        atob(base64),
        c => c.charCodeAt(0)
    );
}


async function decryptLetter(password) {

    const encoder = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: base64ToBytes(salt),
            iterations: 200000,
            hash: "SHA-256"
        },
        keyMaterial,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
        {
            name: "AES-GCM",
            iv: base64ToBytes(iv)
        },
        key,
        base64ToBytes(encryptedLetter)
    );

    return new TextDecoder().decode(decrypted);
}


const unlock = document.getElementById("unlock");

const passwordInput =
    document.getElementById("password");

const error =
    document.getElementById("error");


unlock.addEventListener("click", async () => {

    error.style.display = "none";

    try {

        const text =
            await decryptLetter(passwordInput.value);

        const content =
            document.createElement("div");

        content.style.whiteSpace = "pre-wrap";
        content.style.lineHeight = "1.9";
        content.style.fontSize = "17px";

        content.textContent = text;

        document.body.classList.add("unlocked");

        document
            .querySelector(".container")
            .replaceChildren(content);

    } catch {

        error.style.display = "block";

    }

});


passwordInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        unlock.click();
    }

});
