const salt = "c5WYzNbe93rAyhaFb7z2TQ==";
const iv = "x8vuRsegu9TH9DnW";


function base64ToBytes(base64) {
    return Uint8Array.from(
        atob(base64),
        c => c.charCodeAt(0)
    );
}


async function decryptLetter(password) {

    const encoder = new TextEncoder();

    const keyMaterial = await crypto.subtle.importKey(
        "raw",
        encoder.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
    );

    const key = await crypto.subtle.deriveKey(
        {
            name: "PBKDF2",
            salt: base64ToBytes(salt),
            iterations: 200000,
            hash: "SHA-256"
        },
        keyMaterial,
        {
            name: "AES-GCM",
            length: 256
        },
        false,
        ["decrypt"]
    );

    const decrypted = await crypto.subtle.decrypt(
        {
            name: "AES-GCM",
            iv: base64ToBytes(iv)
        },
        key,
        base64ToBytes(encryptedLetter)
    );

    return new TextDecoder().decode(decrypted);
}


document
.getElementById("unlock")
.addEventListener("click", async () => {

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");

    error.style.display = "none";

    try {

        const text =
            await decryptLetter(password);

        document.body.classList.add("unlocked");

        const letter = document.createElement("div");

        letter.style.whiteSpace = "pre-wrap";
        letter.style.lineHeight = "1.9";
        letter.style.fontSize = "17px";

        letter.textContent = text;

        document
            .querySelector(".container")
            .replaceChildren(letter);

    } catch {

        error.style.display = "block";

    }

});


document
.getElementById("password")
.addEventListener("keydown", event => {

    if (event.key === "Enter") {

        document
            .getElementById("unlock")
            .click();

    }

});
