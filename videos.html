<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>my videos text for Emily</title>
<style>
body {
    margin: 0;
    min-height: 100vh;
    background: #03050a;
    color: #eeeeee;
    font-family: "Courier New", monospace;
    padding: 40px;
}

.back {
    color: #57a8ff;
    text-decoration: none;
    font-size: 16px;
}

h1 {
    margin-top: 70px;
    font-weight: normal;
    font-size: 38px;
}

.subtitle {
    color: rgba(255,255,255,.5);
    margin-bottom: 50px;
}

#reels {
    display: flex;
    flex-direction: column;
    gap: 22px;
    max-width: 600px;
}

.reel {
    display: block;
    padding: 20px 0;
    border-bottom: 1px solid rgba(87,168,255,.25);
    color: #57a8ff;
    text-decoration: none;
    font-size: 19px;
}

.reel:hover {
    color: white;
}

.empty {
    color: rgba(255,255,255,.4);
}
.videoReel {
    width: 100%;
    margin-bottom: 35px;
}
.videoReel video {
    width: 100%;
    max-height: 75vh;
    background: black;
    border-radius: 14px;
    display: block;
}
.reelNumber {
    color: #57a8ff;
    font-size: 17px;
    margin-bottom: 12px;
}
.reelCaption {
    margin-top: 12px;
    margin-bottom: 18px;
    color: rgba(255,255,255,.75);
    font-size: 16px;
    line-height: 1.7;
}

</style>
</head>

<body>
<a class="back" href="index.html">← worldwithemily.com</a>
<h1>my videos text for Emily</h1>

<p class="subtitle">
little videos, with the words i wanted to say.
</p>

<div id="reels"></div>
<script>
const reels = [

    {
        type: "video",
        src: "media/reels/video/video01.mp4",
        caption: "emily this is for you, whenever i feel like talking to you, i will make a video"
    },

];
const container = document.getElementById("reels");

if (reels.length === 0) {

    container.innerHTML = `
        <div class="empty">
            no videos saved yet.
        </div>
    `;

} else {
    reels.forEach((reel, index) => {
        if (reel.type === "video") {

            const wrapper = document.createElement("div");
            wrapper.className = "videoReel";

            wrapper.innerHTML = `
                <div class="reelNumber">
                    Reel ${String(index + 1).padStart(2, "0")}
                </div>

                <video controls playsinline preload="metadata">
                    <source src="${reel.src}" type="video/mp4">
                </video>
                <div class="reelCaption">
                    ${reel.caption || ""}
                </div>
            `;

            container.appendChild(wrapper);

        }
        if (reel.type === "link") {
            const link = document.createElement("a");
            link.className = "reel";
            link.href = reel.src;
            link.target = "_blank";

            link.textContent =
                "Reel " + String(index + 1).padStart(2, "0");
            container.appendChild(link);

        }

    });

}
</script>
</body>
</html>
